<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>

<body>
  <div class="main-container">
    <h1>Calculator</h1>
    <div class="calculator-container">
      <div class="result-display">

        <div class="mini-display">
        </div>

        <div class="active-display">
        </div>

      </div>

      <div class="calculator-grid">

        <button class="btn button-clear"=>AC</button>
        <button class="btn button-backspace">
          <svg class="delete-button-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
            <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
            <line x1="18" y1="9" x2="12" y2="15"></line>
            <line x1="12" y1="9" x2="18" y2="15"></line>
          </svg>
        </button>
        <button class="btn button-divide">÷</button>
        <button class="btn button-7">7</button>

        <button class="btn button-8">8</button>
        <button class="btn button-9">9</button>
        <button class="btn button-multiply">*</button>
        <button class="btn button-4">4</button>

        <button class="btn button-5">5</button>
        <button class="btn button-6">6</button>
        <button class="btn button-subtract">-</button>
        <button class="btn button-1">1</button>

        <button class="btn button-2">2</button>
        <button class="btn button-3">3</button>
        <button class="btn button-add">+</button>
        <button class="btn button-0">0</button>

        <button class="btn button-period">.</button>
        <button class="btn button-equal">=</button>

      </div>
    </div>
  </div>

  <p>Made by <a href="https://github.com/abenixz">@abenixz</a></p>

</body>

</html
